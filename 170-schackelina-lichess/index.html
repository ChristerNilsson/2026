<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#243b32">
    <title>Schackelina – spela igenom partiet</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #f3f1e9;
        color: #243b32;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.5;
      }
      main { width: min(100%, 1000px); margin: auto; padding: 28px 16px; }
      header { margin-bottom: 20px; }
      .eyebrow { margin: 0 0 4px; font-size: .8rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
      h1 { margin: 0 0 8px; font-size: clamp(1.6rem, 5vw, 2.5rem); line-height: 1.2; }
      p { margin: 0; }
      .board { width: 50%; height: 300px; margin-inline: auto; overflow: hidden; border-radius: 12px; background: #262421; box-shadow: 0 8px 30px #243b3218; }
      footer { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; margin-top: 16px; font-size: .9rem; }
      a { color: inherit; text-underline-offset: 3px; }
      a:focus-visible { outline: 3px solid #876323; outline-offset: 5px; }
      @media (max-width: 600px) {
        main { padding: 20px 8px; }
        header, footer { padding-inline: 8px; }
        .board { height: calc(50vw + 120px); min-height: 275px; border-radius: 6px; }
        iframe { height: calc(100vw + 240px); min-height: 550px; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Schackelina</p>
        <h1>Spela igenom partiet</h1>
        <p>Följ partiet drag för drag med pilarna under brädet.</p>
      </header>
      <section class="board" aria-label="Interaktivt schackparti från Lichess">
        <iframe
          src="https://lichess.org/study/embed/TsCoD5zF/icPIFRqp"
          title="Schackparti – interaktiv Lichess-studie"
          width="100%"
          height="100%"
          allowfullscreen>
        </iframe>
      </section>
      <footer>
        <p>Tryck på helskärmsknappen för ett större bräde.</p>
        <a href="https://lichess.org/study/TsCoD5zF/icPIFRqp" target="_blank" rel="noopener noreferrer">Öppna på Lichess ↗</a>
      </footer>
    </main>
  </body>
</html>
