<title id="title">Trippel Trekant</title>
<desc id="desc">Nio schackbräden och nio klockor. Vit dam står på vit ruta. Spelarna A till I sitter där respektive två brädens förlängda d/e-mittlinjer korsar varandra, med ett vitt och ett svart parti var.</desc>
