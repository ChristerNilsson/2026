<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hitta vägen till TARGET</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --panel: #ffffff;
        --text: #1f2a37;
        --muted: #5b6472;
        --accent: #2b6cb0;
        --accent-dark: #1e4d7a;
        --border: #dfe7f1;
        --node: #eef4ff;
        --current: #dbeafe;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .page {
        max-width: 1000px;
        margin: 32px auto;
        padding: 20px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
        padding: 24px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 2rem;
      }

      .rules {
        margin: 0 0 18px;
        color: var(--muted);
        line-height: 1.5;
      }

      .course-choice {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 18px;
        font-weight: 700;
      }

      .course-choice select {
        padding: 7px 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: white;
        color: var(--text);
        font: inherit;
      }

      .course-editor {
        display: grid;
        gap: 10px;
        margin-bottom: 22px;
      }

      .course-editor label {
        font-weight: 700;
      }

      #course-text {
        width: 100%;
        min-height: 150px;
        resize: vertical;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: #f8fafc;
        color: var(--text);
        font: 1rem/1.45 Consolas, "Courier New", monospace;
        white-space: pre;
        tab-size: 2;
      }

      .update-button {
        justify-self: start;
        padding: 9px 14px;
        border: 1px solid var(--accent-dark);
        border-radius: 9px;
        background: white;
        color: var(--accent-dark);
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      .update-button:hover {
        background: var(--node);
      }

      #app {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .status-bar {
        font-size: 1.05rem;
        font-weight: 700;
      }

      .tree {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 34px;
        padding: 4px 0;
      }

      .connections {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        overflow: visible;
      }

      .connection {
        stroke: #b7c5d8;
        stroke-width: 3;
        stroke-linecap: round;
      }

      .level {
        position: relative;
        z-index: 1;
        display: flex;
        justify-content: center;
        gap: 18px;
        flex-wrap: wrap;
        width: 100%;
        transform: translateX(calc(var(--offset, 0) * 122px));
      }

      .node {
        min-width: 104px;
        padding: 12px 16px;
        border-radius: 12px;
        border: 2px solid var(--border);
        text-align: center;
        font-weight: 700;
        font-size: 1rem;
        transition: background-color 0.15s, border-color 0.15s, box-shadow 0.15s,
          transform 0.15s;
      }

      .node.current {
        background: var(--current);
        border-color: var(--accent);
        box-shadow: 0 0 0 4px rgba(43, 108, 176, 0.12);
        color: var(--text);
        opacity: 1;
      }

      .node:not(:disabled) {
        background: var(--accent);
        color: white;
        border-color: var(--accent-dark);
        cursor: pointer;
        box-shadow: 0 4px 9px rgba(43, 108, 176, 0.3);
      }

      .node:not(:disabled):hover {
        background: var(--accent-dark);
        transform: translateY(-2px);
        box-shadow: 0 6px 12px rgba(43, 108, 176, 0.38);
      }

      .node:not(:disabled):focus-visible {
        outline: 3px solid #f59e0b;
        outline-offset: 3px;
      }

      .node:disabled:not(.current) {
        background: #f1f3f5;
        border-color: #cbd5e1;
        color: #7b8491;
        cursor: not-allowed;
        opacity: 0.72;
      }

      .win-message {
        margin: 0;
        color: #0f766e;
        font-weight: 700;
      }

      .error-message {
        margin: 0;
        color: #b42318;
        font-weight: 700;
      }

      @media (max-width: 520px) {
        .level {
          gap: 8px;
          flex-wrap: nowrap;
        }

        .level {
          transform: translateX(calc(var(--offset, 0) * 84px));
        }

        .node {
          min-width: 76px;
          padding: 10px 8px;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="panel">
        <h1>Hitta vägen</h1>
        <p class="rules">Klicka dig genom banan från startnoden till målet. Endast möjliga drag är klickbara.</p>
        <label class="course-choice">
          Bana
          <select id="course-select">
            <option value="bana.txt">bana.txt</option>
            <option value="romb.txt">romb.txt</option>
          </select>
        </label>
        <div class="course-editor">
          <label for="course-text">Banans text</label>
          <textarea id="course-text" spellcheck="false" aria-describedby="editor-help"></textarea>
          <span id="editor-help" class="rules">Behåll indenteringen – den bestämmer vilka drag som är möjliga.</span>
          <button id="update-course" class="update-button" type="button">Uppdatera visningen</button>
        </div>
        <div id="app"></div>
      </section>
    </main>

    <script src="./sketch.js"></script>
  </body>
</html>
